# Cloudflare Worker for Fermi accounts. Deployed by .github/workflows/deploy-worker.yml,
# which fills in the D1 database id. To run it yourself: npx wrangler deploy (from this folder).
name = "fermi-api"
main = "src/index.js"
compatibility_date = "2026-01-01"

[[d1_databases]]
binding = "DB"
database_name = "fermi"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[vars]
# Comma-separated list of page origins allowed to call the API, or "*" for any.
ALLOWED_ORIGINS = "*"
# PBKDF2-SHA256 work factor for new passwords.
PBKDF2_ITERATIONS = "100000"

[observability]
enabled = true
